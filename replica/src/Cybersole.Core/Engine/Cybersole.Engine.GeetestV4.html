<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geetest Captcha</title>
    <style>
        #captcha {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            color: white;
        }
        .error {
            color: red;
        }
    </style>
</head>

<body style='background-color: #161620; margin:0'>
<div id="captcha"></div>

    <script src="https://static.geetest.com/v4/gt4.js"></script>
    <script>
        initGeetest4(
            {
                captchaId: document.Solver.Captcha.Sitekey,
                product: "popup"
            },
            function (captcha) {
                captcha.appendTo("#captcha");
                captcha.onSuccess(() => {
                    var result = captcha.getValidate();

                    document.Solver.Captcha.Solve(JSON.stringify(result));
                });
            }
        );
    </script>
</body>

</html>
